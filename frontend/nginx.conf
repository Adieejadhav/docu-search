worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format docusearch_api
        '$time_iso8601 frontend_proxy\n'
        '  method=$request_method\n'
        '  path=$uri\n'
        '  status=$status\n'
        '  upstream_status=$upstream_status\n'
        '  duration=${request_time}s\n'
        '  upstream_time=${upstream_response_time}s\n'
        '  bytes=$bytes_sent';

    log_format docusearch_access
        '$time_iso8601 frontend_request\n'
        '  method=$request_method\n'
        '  path=$uri\n'
        '  status=$status\n'
        '  duration=${request_time}s\n'
        '  bytes=$bytes_sent';

    server {
        listen 8080;
        server_name _;
        
        access_log /dev/stdout docusearch_access;

        root /usr/share/nginx/html;
        index index.html;

        location = /nginx-health {
            access_log off;
            return 204;
        }

        location = /api {
            access_log /dev/stdout docusearch_api;
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            access_log /dev/stdout docusearch_api;
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
