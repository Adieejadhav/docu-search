worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format docusearch_api
        'ts=$time_iso8601 level=info service=frontend event=proxy_request '
        'method=$request_method path=$uri status=$status duration=$request_time '
        'upstream_status=$upstream_status upstream_time=$upstream_response_time bytes=$body_bytes_sent';

    map $uri $docusearch_api_loggable {
        default 1;
        /api/health 0;
        /nginx-health 0;
    }

    server {
        listen 8080;
        server_name _;
        access_log off;

        root /usr/share/nginx/html;
        index index.html;

        location = /nginx-health {
            access_log off;
            return 204;
        }

        location = /api {
            access_log /dev/stdout docusearch_api if=$docusearch_api_loggable;
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            access_log /dev/stdout docusearch_api if=$docusearch_api_loggable;
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
